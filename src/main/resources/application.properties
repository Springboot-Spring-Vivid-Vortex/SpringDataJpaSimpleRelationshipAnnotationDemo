# =============================================================================
# Application configuration
# =============================================================================
# This demo uses an *in-memory* H2 database so the project runs with zero
# external setup - just `./gradlew bootRun`. Data is re-created every time the
# application starts (see ddl-auto=create-drop below) and is lost on shutdown.
# That is exactly what we want for a teaching project: every run starts from
# a clean, predictable state.

spring.application.name=SpringDataSimpleRelationshipAnnotationDemo

# --- Datasource -------------------------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the lifetime of the
# JVM instead of being destroyed as soon as the first connection closes.
spring.datasource.url=jdbc:h2:mem:jparelationshipsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 web console ----------------------------------------------------------
# Browse the live schema/data at http://localhost:8080/h2-console
# JDBC URL to use in the login form: jdbc:h2:mem:jparelationshipsdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ----------------------------------------------------------
# create-drop: Hibernate generates the schema from our @Entity classes on
# startup and drops it on shutdown. Great for demos; NEVER use this in
# production (use a migration tool such as Flyway/Liquibase instead).
spring.jpa.hibernate.ddl-auto=create-drop

# Print every generated SQL statement to the console, nicely formatted, so
# you can see exactly what Hibernate does for each relationship annotation.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log the values bound to '?' placeholders (very useful when learning) -
# without this, SQL is shown but the bind parameters are hidden.
logging.level.org.hibernate.orm.jdbc.bind=trace

# Show a human-readable comment above each SQL statement naming the JPA
# operation that triggered it.
spring.jpa.properties.hibernate.use_sql_comments=true
